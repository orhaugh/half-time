# half-time's systems. run.sh runs clink's Coordinator and Workers on the host,
# from a local build, and they reach these through their host ports.
#
#   docker compose up -d --wait kafka postgres neo4j clickhouse mysql pulsar rabbitmq nats redis cassandra
#   docker compose run --rm --no-deps -T kafka-init    # the topics
#   docker compose run --rm --no-deps -T nats-init     # the alert stream
#   docker compose down -v                             # remove everything, data included
#
# Host ports, for a clink run from the host (override if they collide):
#   KAFKA_HOST_PORT       the broker                       default 29092
#   POSTGRES_HOST_PORT    the order store and the ledgers  default 25432
#   NEO4J_HTTP_PORT       Neo4j Browser and Query API      default 7474
#   CLICKHOUSE_HOST_PORT  ClickHouse's native port         default 29000
#   MYSQL_HOST_PORT       the menu store                   default 23306
#   PULSAR_HTTP_PORT      Pulsar's admin API               default 28080
#   RABBITMQ_HOST_PORT    the desk's queue                 default 5672
#   RABBITMQ_HTTP_PORT    RabbitMQ's management UI and API default 15672
#   NATS_HOST_PORT        the alert bus                    default 4222
#   REDIS_HOST_PORT       the tracker                      default 6379
#   OPENSEARCH_HOST_PORT  the menu search                  default 29200
#   INFLUXDB_HOST_PORT    the telemetry store              default 28086
#   PUSHGATEWAY_HOST_PORT the gauges                       default 29091
#   PROMETHEUS_HOST_PORT  Prometheus                       default 29090
#   GRAFANA_HOST_PORT     Grafana (admin / halftime)       default 23000
# Pulsar's broker port (6650) and Cassandra's native port (9042) stay as they
# are: both protocols tell a client the address to come back to, and these
# say 127.0.0.1 with the port the container listens on (PULSAR_ADVERTISED and
# CASSANDRA_ADVERTISED name another address, for a rig).

services:
  # One KRaft node. Transactions need the transaction-state topic, so its
  # replication factor and minimum ISR are 1 here. Topics are created by
  # kafka-init, never on first use, so a misspelt topic fails loudly.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      # Each check starts a JVM, which costs the broker's container a core
      # for a second or two: every 2 s while it starts, every 30 s after, so
      # the checks stay out of the latency the run measures.
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 10s
      retries: 5

  # The topics, three partitions each. Records carry no key and spread over
  # the partitions, so every partition keeps flowing and no watermark waits on
  # an empty one. Order is by event time, not by arrival:
  #   riders.positions      every rider's position, from the rider app
  #   orders.changes        every change to an order, exactly once, as the
  #                         order store commits it
  #   pricing.multipliers   each zone's surge multiplier, once a minute
  #   orders.priced         each order with the multiplier it was placed under
  #   dispatch.decisions    each order assigned to a rider, or escalated
  #   ledger.payouts        each payout, exactly once, as the ledger records it
  #   menus.changes         every change to a menu, exactly once, from the menu
  #                         system's binary log
  #   kitchen.alerts        a restaurant that bounced three orders in a row, once
  #   match.events          the broadcaster's feed, as the match job polled it
  #   kitchen.events        the restaurant tablets' events: one partition, in the
  #                         order the tablets sent them, as the vendor's bus is
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        # Stamped by the broker as each record arrives, so latency is measured
        # from when a record reached Kafka.
        for t in riders.positions orders.changes pricing.multipliers orders.priced \
                 dispatch.decisions ledger.payouts menus.changes kitchen.alerts match.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1 \
            --config message.timestamp.type=LogAppendTime
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic kitchen.events --partitions 1 --replication-factor 1 \
          --config message.timestamp.type=LogAppendTime
    restart: "no"

  # The order store (the platform's system of record, read by clink as a
  # change stream) and the ledgers clink writes exactly once.
  # wal_level=logical is what a replication slot needs;
  # max_prepared_transactions > 0 is what PREPARE TRANSACTION needs.
  postgres:
    image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    command: >-
      postgres -c wal_level=logical -c max_replication_slots=8 -c max_wal_senders=8
      -c max_prepared_transactions=32 -c track_commit_timestamp=on
    environment:
      POSTGRES_USER: halftime
      POSTGRES_PASSWORD: halftime
      POSTGRES_DB: halftime
    ports:
      - "${POSTGRES_HOST_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halftime -d halftime"]
      interval: 2s
      timeout: 5s
      retries: 60

  # The city graph: zones and which zones touch, restaurants and where they
  # are. Community, single instance, pinned by digest. The password is this
  # project's own.
  neo4j:
    image: neo4j:2026.09.0-community@sha256:d6269a020149934597c8c3df926d080a612796dbbb48861ca9d5b1109cabf0d8
    environment:
      NEO4J_AUTH: neo4j/half-time-pw
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474/ || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 5s

  # The analytics store. clink writes it through the native protocol, at
  # least once; the schema deduplicates by key. The run's archive directory
  # is mounted so the archive check can read the Parquet files back with
  # ClickHouse, an independent reader.
  clickhouse:
    image: clickhouse/clickhouse-server:25.3@sha256:b627d7a9bc0e0c1bac26cdbe9d2fc6316faa29c5d8a174f28f5abd57d0fa6ba2
    environment:
      CLICKHOUSE_USER: halftime
      CLICKHOUSE_PASSWORD: halftime
      CLICKHOUSE_DB: halftime
    ulimits:
      nofile: 262144
    ports:
      - "${CLICKHOUSE_HOST_PORT:-29000}:9000"
    volumes:
      - ./state/archive:/var/lib/clickhouse/user_files/archive
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user halftime --password halftime --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 60

  # The systems around the core (round 2).

  # The legacy menu system: the restaurants' menus and prices, read as a change
  # stream from the binary log, which the server writes row by row with the
  # whole row. mysql/schema.sql makes the table and the capture user.
  mysql:
    image: mysql:8.0
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    environment:
      MYSQL_ROOT_PASSWORD: halftime
      MYSQL_DATABASE: halftime
    ports:
      - "${MYSQL_HOST_PORT:-23306}:3306"
    healthcheck:
      # Over TCP: the image first runs a socket-only server, to initialise.
      test: ["CMD-SHELL", "MYSQL_PWD=halftime mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 20s

  # The restaurant tablets' bus and the partners' bus. Standalone, without the
  # function worker and the stream storage. A client that looks a topic up is
  # sent to the advertised address, so it is the one clink on the host can
  # reach.
  pulsar:
    image: apachepulsar/pulsar:3.3.1
    command: ["bash", "-c", "bin/apply-config-from-env.py conf/standalone.conf && exec bin/pulsar standalone -nfw -nss"]
    environment:
      PULSAR_MEM: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m"
      PULSAR_PREFIX_advertisedAddress: ${PULSAR_ADVERTISED:-127.0.0.1}
    ports:
      - "6650:6650"
      - "${PULSAR_HTTP_PORT:-28080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/admin/v2/brokers/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  # The operations desk's queue. The user is this project's own: the default
  # one may only connect from inside the container.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: halftime
      RABBITMQ_DEFAULT_PASS: halftime
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_HTTP_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 15s

  # The dispatch floor's alert bus, JetStream on. The sink publishes to a
  # subject; the stream that keeps the subject's messages is made by
  # nats-init, as NATS keeps nothing on its own.
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_HOST_PORT:-4222}:4222"
      - "${NATS_HTTP_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8222/healthz || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40

  # The stream on the alert bus, made once the bus is up, and the container
  # the tools run the nats command line in.
  nats-init:
    image: natsio/nats-box:latest
    depends_on:
      nats:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        nats --server nats://nats:4222 stream info ALERTS >/dev/null 2>&1 || \
          nats --server nats://nats:4222 stream add ALERTS --subjects ops.alerts --storage file --defaults
        echo "nats: stream ALERTS keeps ops.alerts"
    restart: "no"

  # The live order tracker: one key per order, replaced as the order moves,
  # and one per order with its rider.
  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40

  # The customer app's order history. One node; cassandra/schema.cql makes
  # the keyspace and the table, which the sink expects to exist. A driver that
  # connects is told the node's address to come back to, so it is the one
  # clink on the host can reach.
  cassandra:
    image: cassandra:4
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_BROADCAST_RPC_ADDRESS: ${CASSANDRA_ADVERTISED:-127.0.0.1}
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT cluster_name FROM system.local"]
      interval: 10s
      timeout: 15s
      retries: 60
      start_period: 60s

  # Search, the lakehouse's reader, telemetry and the gauges (round 3).

  # The menu search. One node, the security plugin off, plain HTTP on 9200.
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_HOST_PORT:-29200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # The telemetry store: every rider's position as a point. The organisation,
  # the bucket and the token the sink uses are made at first start.
  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: halftime
      DOCKER_INFLUXDB_INIT_PASSWORD: halftime-password
      DOCKER_INFLUXDB_INIT_ORG: halftime
      DOCKER_INFLUXDB_INIT_BUCKET: halftime
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: halftime-token
    ports:
      - "${INFLUXDB_HOST_PORT:-28086}:8086"
    healthcheck:
      test: ["CMD-SHELL", "influx ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  # The gauges: each zone's surge multiplier, pushed by the gauges job and
  # scraped by Prometheus.
  pushgateway:
    image: prom/pushgateway:v1.10.0
    ports:
      - "${PUSHGATEWAY_HOST_PORT:-29091}:9091"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9091/-/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Prometheus scrapes clink's own metrics on the host and the Pushgateway
  # (deploy/prometheus.yml); Grafana shows them (deploy/grafana).
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_HOST_PORT:-29090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: halftime
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-23000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
