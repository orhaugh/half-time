# The menu search and the telemetry store, on one host.
services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: opensearch
    network_mode: host
    environment:
      discovery.type: single-node
      network.host: 0.0.0.0
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    network_mode: host
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: halftime
      DOCKER_INFLUXDB_INIT_PASSWORD: halftime-password
      DOCKER_INFLUXDB_INIT_ORG: halftime
      DOCKER_INFLUXDB_INIT_BUCKET: halftime
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: halftime-token
    healthcheck:
      test: ["CMD-SHELL", "influx ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
