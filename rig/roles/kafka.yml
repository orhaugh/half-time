# The broker, on a host of its own, advertising its private address: a Kafka
# client follows the advertised address after bootstrap. One KRaft node, the
# topics made by kafka-init, as on one machine. PRIVATE_IP and PARTITIONS come
# from the host's .env, written by rig/run.sh.
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    network_mode: host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${PRIVATE_IP}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${PRIVATE_IP}:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms2g -Xmx2g}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 10s
      retries: 5
  kafka-init:
    image: apache/kafka:3.9.1
    network_mode: host
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in riders.positions orders.changes pricing.multipliers orders.priced \
                 dispatch.decisions ledger.payouts menus.changes kitchen.alerts match.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${PRIVATE_IP}:9092 --create --if-not-exists \
            --topic "$$t" --partitions ${PARTITIONS:-3} --replication-factor 1 \
            --config message.timestamp.type=LogAppendTime
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${PRIVATE_IP}:9092 --create --if-not-exists \
          --topic kitchen.events --partitions 1 --replication-factor 1 \
          --config message.timestamp.type=LogAppendTime
    restart: "no"
