# What the ops host runs beside the feeders and the checks: the gauges'
# gateway, Prometheus (its targets written by rig/run.sh into
# rig/generated/prometheus.yml) and Grafana with the half-time dashboard.
services:
  pushgateway:
    image: prom/pushgateway:v1.10.0
    container_name: pushgateway
    network_mode: host
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - /ht/half-time/rig/generated/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: halftime
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      PROMETHEUS_URL: http://127.0.0.1:9090
    volumes:
      - /ht/half-time/deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - /ht/half-time/deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
